name: PR CI

# Sin `edited`: editar el título no debe re-correr el CI. Si lo re-corriera
# saltándolo, el check quedaría "skipped" sobre el mismo commit, y GitHub
# cuenta un skipped como aprobado. El título lo valida pr-lint.yaml.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  # Imagen del preview (ver preview-deploy.yaml). Sólo PRs de este repo: un
  # fork no tiene token con packages:write. Tag inmutable por commit: el
  # preview exige luego que responda ese SHA.
  preview-image:
    needs: ci
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .containers/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          # NEXT_PUBLIC_* va compilada: cada PR tiene su dominio.
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=https://auth-pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
            APP_VERSION=${{ github.event.pull_request.head.sha }}

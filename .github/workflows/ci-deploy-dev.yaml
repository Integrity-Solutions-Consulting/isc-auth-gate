name: CI + Deploy Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mismo CI que el PR: re-valida main ya mergeado antes de desplegar.
  ci:
    uses: ./.github/workflows/ci.yaml

  deploy-dev:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DOMAIN_DEV }}
    # Secrets de environment, no de repo: sólo los ve un job de `main` dentro
    # de este environment. Un workflow en otra rama no puede leer la API key
    # de Dokploy (que controla todo el servidor, no sólo esta app).
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      # La app de dev tiene source GitHub (para los preview deployments
      # nativos): Dokploy construye `main` en el servidor. Antes de desplegar
      # se fija APP_VERSION=<sha> como build arg (conservando el env) para que
      # el health check pueda exigir este commit. NEXT_PUBLIC_* se compila en
      # el bundle del cliente, por eso también va como build arg.
      - name: Build args
        env:
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          PUBLIC_URL: ${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL_DEV }}
        run: |
          app=$(curl -fsS -H "x-api-key: $DOKPLOY_API_KEY" "$DOKPLOY_URL/api/application.one?applicationId=$APP_ID")
          jq -n --argjson app "$app" --arg sha "$GITHUB_SHA" --arg url "$PUBLIC_URL" '{
            applicationId: $app.applicationId,
            env: ($app.env // ""),
            buildSecrets: ($app.buildSecrets // ""),
            createEnvFile: ($app.createEnvFile // false),
            buildArgs: "NEXT_PUBLIC_BETTER_AUTH_URL=\($url)\nAPP_VERSION=\($sha)"
          }' | curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'content-type: application/json' --data @- \
            "$DOKPLOY_URL/api/application.saveEnvironment" >/dev/null

      - name: Deploy to Dokploy
        env:
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' \
            "$DOKPLOY_URL/api/application.deploy" \
            -d "{\"applicationId\":\"$APP_ID\",\"title\":\"main @ ${GITHUB_SHA::7}\"}" >/dev/null

      # 200 no basta: si el contenedor nuevo muere migrando, el anterior sigue
      # respondiendo. Se exige que el que responde sea este commit.
      - name: Health check
        env:
          HEALTH_URL: ${{ vars.DOMAIN_DEV }}/api/health
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # 90 × 10s = 15 min: ahora incluye el build en el servidor (~5 min)
          # además de la espera de DB, migraciones y arranque (~4 min).
          for i in $(seq 1 90); do
            version=$(curl -fsS "$HEALTH_URL" | jq -r .version || true)
            if [ "$version" = "$EXPECTED_VERSION" ]; then
              echo "Healthy ($version) after attempt $i"
              exit 0
            fi
            echo "Attempt $i: version '$version' != '$EXPECTED_VERSION' — retry in 10s"
            sleep 10
          done
          echo "Health check failed: revisa los logs del contenedor en Dokploy (¿migración fallida?)"
          exit 1

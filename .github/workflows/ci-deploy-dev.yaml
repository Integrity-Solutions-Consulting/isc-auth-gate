name: CI + Deploy Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mismo CI que el PR: re-valida main ya mergeado antes de construir.
  ci:
    uses: ./.github/workflows/ci.yaml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR exige minúsculas y el owner (la org) tiene mayúsculas.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .containers/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}
          # Sólo NEXT_PUBLIC_*: Next la compila en el bundle del cliente. Las
          # vars de servidor entran en runtime desde Dokploy. Es pública: va
          # como variable de repo, no como secret.
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL_DEV }}
            APP_VERSION=${{ github.sha }}

  deploy-dev:
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DOMAIN_DEV }}
    # Secrets de environment, no de repo: sólo los ve un job de `main` dentro
    # de este environment. Un workflow en otra rama no puede leer la API key
    # de Dokploy (que controla todo el servidor, no sólo esta app).
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # GHCR exige minúsculas y el owner (la org) tiene mayúsculas.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Update image tag
        run: |
          bunx @dokploy/cli application save-docker-provider \
            --applicationId ${{ secrets.DOKPLOY_APP_ID }} \
            --dockerImage "$IMAGE:dev" \
            --username "" \
            --password "" \
            --registryUrl "ghcr.io"

      - name: Deploy to Dokploy
        run: bunx @dokploy/cli application deploy --applicationId ${{ secrets.DOKPLOY_APP_ID }}

      # 200 no basta: si el contenedor nuevo muere migrando, el anterior sigue
      # respondiendo. Se exige que el que responde sea este commit.
      - name: Health check
        env:
          HEALTH_URL: ${{ vars.DOMAIN_DEV }}/api/health
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # 45 × 10s ≈ 7,5 min: el primer deploy tardó ~4 min (intento 24/30)
          # entre espera de DB, migraciones y arranque; 30 dejaba poco margen.
          for i in $(seq 1 45); do
            version=$(curl -fsS "$HEALTH_URL" | jq -r .version || true)
            if [ "$version" = "$EXPECTED_VERSION" ]; then
              echo "Healthy ($version) after attempt $i"
              exit 0
            fi
            echo "Attempt $i: version '$version' != '$EXPECTED_VERSION' — retry in 10s"
            sleep 10
          done
          echo "Health check failed: revisa los logs del contenedor en Dokploy (¿migración fallida?)"
          exit 1

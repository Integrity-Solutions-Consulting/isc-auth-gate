name: Preview Cleanup

# Al cerrar o mergear el PR borra su app y su Postgres en Dokploy.
# pull_request_target: corre la definición de `main` (necesario para el
# environment `preview`) y no hace checkout del código del PR.
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  destroy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      PREVIEW_ENVIRONMENT_ID: ${{ vars.DOKPLOY_PREVIEW_ENVIRONMENT_ID }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
    steps:
      # Checkout explícito de main: nunca el head del PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Destroy
        run: .github/scripts/preview.sh destroy "${{ github.event.pull_request.number }}"

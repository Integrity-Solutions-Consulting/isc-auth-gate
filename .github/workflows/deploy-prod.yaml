name: Deploy Prod

# Build propio: NEXT_PUBLIC_BETTER_AUTH_URL se compila en el bundle, así que la
# imagen de dev no sirve para prod. Cada build queda como :prod-<sha>.
on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Vacío = CI + build del commit actual. Un commit SHA completo (40 caracteres) = redesplegar :prod-<sha> sin reconstruir (rollback). No revierte migraciones."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ inputs.rollback_sha == '' }}
    uses: ./.github/workflows/ci.yaml

  build-push:
    needs: ci
    if: ${{ inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR exige minúsculas y el owner (la org) tiene mayúsculas.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .containers/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:prod-${{ github.sha }}
          # Sólo NEXT_PUBLIC_*: Next la compila en el bundle del cliente. Las
          # vars de servidor entran en runtime desde Dokploy. Es pública: va
          # como variable de repo, no como secret.
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL_PROD }}
            APP_VERSION=${{ github.sha }}

  deploy-prod:
    needs: [ci, build-push]
    # En rollback ci y build-push quedan `skipped`: se despliega igual, pero
    # nunca si alguno falló.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # El environment `production` exige aprobación manual antes de este job y
    # sólo admite la rama main.
    environment:
      name: production
      url: ${{ vars.DOMAIN_PROD }}
    # Secrets de environment, no de repo: sólo los ve un job de `main` dentro
    # de este environment. Un workflow en otra rama no puede leer la API key
    # de Dokploy (que controla todo el servidor, no sólo esta app).
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      VERSION: ${{ inputs.rollback_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # GHCR exige minúsculas y el owner (la org) tiene mayúsculas.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Tag inmutable: el rollback apunta a la imagen exacta ya construida.
      - name: Update image tag
        run: |
          bunx @dokploy/cli application save-docker-provider \
            --applicationId ${{ secrets.DOKPLOY_APP_ID }} \
            --dockerImage "$IMAGE:prod-$VERSION" \
            --username "" \
            --password "" \
            --registryUrl "ghcr.io"

      - name: Deploy to Dokploy
        run: bunx @dokploy/cli application deploy --applicationId ${{ secrets.DOKPLOY_APP_ID }}

      # 200 no basta: si el contenedor nuevo muere migrando, el anterior sigue
      # respondiendo. Se exige que el que responde sea esta versión.
      - name: Health check
        env:
          HEALTH_URL: ${{ vars.DOMAIN_PROD }}/healthz
          EXPECTED_VERSION: ${{ inputs.rollback_sha || github.sha }}
        run: |
          # 45 × 10s ≈ 7,5 min: el primer deploy tardó ~4 min (intento 24/30)
          # entre espera de DB, migraciones y arranque; 30 dejaba poco margen.
          for i in $(seq 1 45); do
            version=$(curl -fsS "$HEALTH_URL" | jq -r .version || true)
            if [ "$version" = "$EXPECTED_VERSION" ]; then
              echo "Healthy ($version) after attempt $i"
              exit 0
            fi
            echo "Attempt $i: version '$version' != '$EXPECTED_VERSION' — retry in 10s"
            sleep 10
          done
          echo "Health check failed: revisa los logs del contenedor en Dokploy (¿migración fallida?)"
          exit 1
